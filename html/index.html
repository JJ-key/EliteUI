<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EliteUI HTML Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="eliteui.css">
<style>
  /* Demo page: a thin top bar over a full-height stage that stands in for a game viewport.
     Deliberately single-theme dark: EliteUI is an overlay that sits on top of a game. */
  :root {
    color-scheme: dark;
    --page-bg: #07060b;
    --page-bar: #0e0c14;
    --page-line: #1f1c2a;
    --page-text: #ece9f5;
    --page-muted: #9a96ab;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--page-bg);
    color: var(--page-text);
    font: 13px/1.4 "Geist", "Segoe UI", system-ui, sans-serif;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 18px;
    padding: 10px 16px;
    background: var(--page-bar);
    border-bottom: 1px solid var(--page-line);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
  .brand strong { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .brand span { color: var(--page-muted); font: 500 11.5px "Geist Mono", ui-monospace, monospace; }
  .hint { display: flex; align-items: center; gap: 6px; color: var(--page-muted); font-size: 12px; }
  kbd {
    padding: 2px 6px;
    border: 1px solid var(--page-line);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--page-bg);
    color: var(--page-text);
    font: 500 11px "Geist Mono", ui-monospace, monospace;
  }
  .bar button {
    padding: 6px 11px;
    border: 1px solid var(--page-line);
    border-radius: 7px;
    background: transparent;
    color: var(--page-text);
    font: 500 12px "Geist", system-ui, sans-serif;
    cursor: pointer;
  }
  .bar button:hover { border-color: #8b5cf6; }
  .bar button:focus-visible { outline: 2px solid #a855f7; outline-offset: 2px; }
  .stage {
    position: relative;
    flex: 1;
    min-height: 460px;
    overflow: hidden;
    background:
      radial-gradient(60% 50% at 20% 80%, rgba(56, 189, 248, 0.08), transparent 70%),
      radial-gradient(50% 60% at 85% 20%, rgba(236, 72, 153, 0.07), transparent 70%),
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--page-bg);
  }
  @media (max-width: 640px) { .hint { display: none; } }
</style>
</head>
<body>
  <header class="bar">
    <div class="brand"><strong>EliteUI</strong><span>HTML template 0.2</span></div>
    <div class="hint"><kbd>Right Shift</kbd> open or close</div>
    <div class="hint"><kbd>Ctrl K</kbd> search</div>
    <div class="hint">Right-click any setting for more</div>
    <button type="button" id="reopen">Show menu</button>
  </header>
  <main class="stage" id="stage" aria-label="Preview"></main>

  <script src="eliteui.js"></script>
  <script>
    // Same shape as roblox/Example: CreateWindow -> CreateTab -> components.
    const Window = EliteUI.CreateWindow({
      Name: "EliteUI Showcase",
      Subtitle: "v0.2",
      LoadingTitle: "Loading EliteUI",
      Parent: document.getElementById("stage"),
      ToggleKey: "RightShift",
      User: { Name: "Guest" },
      Layout: "Sidebar",          // "Sidebar" | "Tabs" | "Panels"
      Palette: "Violet",          // any name in EliteUI.Palettes
      Backdrop: "Aurora",
      Particles: "Embers",
      ParticleCount: 36,
      HUD: { Watermark: true, ActiveList: true }
    });

    // Tour progress: fills as the visitor tries each kind of control.
    const tried = new Set();
    const KINDS = ["toggle", "module", "slider", "segmented", "dropdown", "color", "keybind", "textbox"];
    let tour = null;
    const touch = (kind) => {
      tried.add(kind);
      if (tour) tour.SetValue((tried.size / KINDS.length) * 100);
    };

    // ---- Overview
    const Home = Window.CreateTab("Overview", "home", "Live stats and quick actions");
    Home.CreateSection("Performance", "activity");
    const fpsGraph = Home.CreateGraph({ Name: "Frame rate", Description: "Measured from this page's render loop", Suffix: "fps" });
    setInterval(() => fpsGraph.Push(Window.GetFPS()), 300);
    tour = Home.CreateProgress({
      Name: "Tour", Description: "Try each kind of control to fill this bar",
      Text: () => tried.size + " of " + KINDS.length
    });

    Home.CreateSection("Quick actions", "zap");
    Home.CreateButton({ Name: "Search everything", Style: "Primary", Icon: "search", Callback: () => Window.OpenSearch() });
    Home.CreateButton({
      Name: "Switch layout", Description: "Sidebar, Tabs, or Panels like a ClickGUI", Icon: "grid",
      Callback: () => {
        const order = EliteUI.Layouts;
        const next = order[(order.indexOf(Window.GetLayout()) + 1) % order.length];
        Window.SetLayout(next);
        Window.Notify({ Title: "Layout: " + next, Content: "Change it any time in Settings, Interface.", Icon: "grid" });
      }
    });
    const types = ["info", "success", "warning", "error"];
    let typeIndex = 0;
    Home.CreateButton({
      Name: "Send a notification", Description: "Cycles through info, success, warning and error", Icon: "bell",
      Callback: () => {
        const type = types[typeIndex++ % types.length];
        Window.Notify({
          Title: type.charAt(0).toUpperCase() + type.slice(1),
          Content: "Hover to pause the timer. This one is a " + type + " notification.",
          Type: type,
          Actions: type === "info" ? [{ Name: "Open settings", Callback: () => Window.SelectTab("Settings") }] : null
        });
      }
    });
    Home.CreateButton({
      Name: "Show a dialog", Icon: "info",
      Callback: () => Window.Dialog({
        Title: "Leave this match?",
        Content: "Dialogs block the menu until you choose. Press Esc or click outside to cancel.",
        Buttons: [{ Name: "Stay" }, { Name: "Leave", Style: "Danger", Callback: () => Window.Notify({ Title: "You picked Leave", Type: "warning" }) }]
      })
    });
    Home.CreateParagraph({
      Icon: "sparkles",
      Title: "Make it yours",
      Content: "Open Settings from your profile card to pick one of 12 palettes, turn on Chroma, or switch to the Panels layout."
    });

    // ---- Modules: toggles with their own settings (Meteor-style)
    const Game = Window.CreateTab("Modules", "gamepad", "Toggles that carry their own settings");
    Game.CreateSection("Movement", "zap");
    const sprint = Game.CreateModule({
      Name: "Auto sprint", Description: "Keeps sprint held while you move", Flag: "AutoSprint", CurrentValue: true,
      Callback: () => touch("module")
    });
    sprint.CreateSlider({ Name: "Speed", Min: 1, Max: 3, Increment: 0.1, Suffix: "×", CurrentValue: 1.4, Flag: "SprintSpeed", Callback: () => touch("slider") });
    sprint.CreateToggle({ Name: "Only on the ground", CurrentValue: true, Flag: "SprintGround", Callback: () => touch("toggle") });
    const jump = Game.CreateModule({ Name: "Double jump", Description: "Jump again in mid-air", Flag: "DoubleJump", Callback: () => touch("module") });
    jump.CreateSlider({ Name: "Extra jumps", Min: 1, Max: 3, CurrentValue: 1, Flag: "ExtraJumps" });

    Game.CreateSection("Display", "eye");
    const dmg = Game.CreateModule({ Name: "Damage numbers", Description: "Floating numbers when you land a hit", Flag: "DamageNumbers", CurrentValue: true, Callback: () => touch("module") });
    dmg.CreateSegmented({ Name: "Style", Options: ["Classic", "Compact", "Bold"], CurrentValue: "Classic", Flag: "DamageStyle", Callback: () => touch("segmented") });
    dmg.CreateColorPicker({ Name: "Critical hit color", CurrentColor: "#f59e0b", Flag: "CritColor", Callback: () => touch("color") });
    Game.CreateToggle({ Name: "Show FPS counter", Flag: "ShowFps", Callback: () => touch("toggle") });
    Game.CreateToggle({ Name: "Mute when unfocused", Flag: "MuteUnfocused", CurrentValue: true, Callback: () => touch("toggle") });

    // ---- Controls
    const Controls = Window.CreateTab("Controls", "sliders", "Every input EliteUI ships with");
    Controls.SetBadge("New");
    Controls.CreateSection("Values", "sliders");
    Controls.CreateSlider({ Name: "Master volume", Min: 0, Max: 100, Suffix: "%", CurrentValue: 70, Flag: "Volume", Callback: () => touch("slider") });
    Controls.CreateSlider({ Name: "Field of view", Description: "Click the number to type an exact value", Min: 70, Max: 120, Increment: 5, Suffix: "°", CurrentValue: 90, Flag: "FOV", Callback: () => touch("slider") });
    Controls.CreateSegmented({ Name: "Difficulty", Options: ["Easy", "Normal", "Hard"], CurrentValue: "Normal", Flag: "Difficulty", Callback: () => touch("segmented") });
    Controls.CreateDropdown({ Name: "Graphics quality", Options: ["Low", "Medium", "High", "Ultra"], CurrentValue: "High", Flag: "Quality", Callback: () => touch("dropdown") });
    Controls.CreateDropdown({
      Name: "Chat channels", Description: "Pick as many as you like", MultipleOptions: true,
      Options: ["General", "Team", "Party", "Trade", "System"], CurrentValue: ["General", "Team"], Flag: "Channels",
      Callback: () => touch("dropdown")
    });
    Controls.CreateDropdown({
      Name: "Server region", Description: "Long lists get a filter box",
      Options: ["US East", "US West", "Brazil", "Europe West", "Europe Central", "Middle East", "India", "Singapore", "Japan", "Australia"],
      CurrentValue: "Europe West", Flag: "Region", Callback: () => touch("dropdown")
    });
    Controls.CreateSection("Input", "keyboard");
    Controls.CreateTextBox({ Name: "Display name", Placeholder: "Type and press Enter", Sensitive: true, Flag: "DisplayName", Callback: () => touch("textbox") });
    Controls.CreateKeybind({
      Name: "Quick menu", CurrentKeybind: "F", Flag: "QuickMenuKey",
      Callback: () => touch("keybind"),
      HoldCallback: () => Window.Notify({ Title: "Quick menu", Content: "You pressed the bound key.", Icon: "keyboard", Duration: 2 })
    });
    Controls.CreateColorPicker({ Name: "Highlight color", CurrentColor: "#22c55e", Flag: "Highlight", Callback: () => touch("color") });

    // ---- Sub-tabs
    const Options = Window.CreateTab("Options", "folder", "Sub-tabs group related pages");
    const Pages = Options.CreateSubTab(["Graphics", "Audio", "Interface"]);
    Pages.Graphics.CreateSection("Display");
    Pages.Graphics.CreateToggle({ Name: "V-Sync", CurrentValue: true, Flag: "VSync" });
    Pages.Graphics.CreateDropdown({ Name: "Frame cap", Options: ["30", "60", "120", "Unlimited"], CurrentValue: "60", Flag: "FrameCap" });
    Pages.Audio.CreateSection("Mix");
    Pages.Audio.CreateSlider({ Name: "Music", Min: 0, Max: 100, Suffix: "%", CurrentValue: 40, Flag: "Music" });
    Pages.Audio.CreateSlider({ Name: "Effects", Min: 0, Max: 100, Suffix: "%", CurrentValue: 80, Flag: "Effects" });
    Pages.Interface.CreateSection("Layout");
    Pages.Interface.CreateToggle({ Name: "Compact lists", Flag: "CompactLists" });
    Pages.Interface.CreateLabel("Sub-tabs take every component a tab does.");

    // Floating toggle button (Roblox: CreateInvisibleButton). It disappears while the menu is closed.
    const narrow = window.innerWidth < 700;
    Window.CreateInvisibleButton({ Size: 46, TapCount: 1, Image: "menu", Position: narrow ? [0.88, 0.955] : [0.05, 0.9] });

    document.getElementById("reopen").addEventListener("click", () => Window.Show());
  </script>
</body>
</html>
